name: Launcher SDK Package
run-name: Launcher SDK · ${{ inputs.package_name }} · ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Android application package name
        required: true
        type: string
      job_id:
        description: Public builder job identifier
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: launcher-sdk-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  build-package-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PACKAGES_OWNER: vihuela
      GITHUB_PACKAGES_REPOSITORY: lawnchair-sdk
      GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SDK_SOURCE_MODE: local
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          ref: feature/sdk-15
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Initialize web result
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          BUILDER_JOB_ID: ${{ inputs.job_id }}
        run: python3 tools/sdk-builder/ci_build.py --package-name "$PACKAGE_NAME" --job-id "$BUILDER_JOB_ID" --initialize-only

      - name: Install required Android SDK
        shell: bash
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Validate build environment
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          BUILDER_JOB_ID: ${{ inputs.job_id }}
        run: python3 tools/sdk-builder/ci_build.py --package-name "$PACKAGE_NAME" --job-id "$BUILDER_JOB_ID" --preflight-only

      - name: Build, verify, and publish package SDK
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          BUILDER_JOB_ID: ${{ inputs.job_id }}
        run: python3 tools/sdk-builder/ci_build.py --package-name "$PACKAGE_NAME" --job-id "$BUILDER_JOB_ID"

      - name: Upload result for web builder
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: launcher-sdk-${{ inputs.job_id }}
          path: tools/sdk-builder/output/${{ inputs.job_id }}/downloads
          if-no-files-found: error
          retention-days: 7
