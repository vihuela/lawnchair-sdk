plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id "maven-publish"
}

def sdkPublishGroup = providers.environmentVariable("GROUP")
    .orElse(providers.gradleProperty("PUBLISH_GROUP"))
    .orElse("app.lawnchair")
def sdkPublishVersion = providers.environmentVariable("VERSION")
    .orElse(providers.gradleProperty("PUBLISH_VERSION"))
    .orElse("0.1.0-local")

android {
    namespace "app.lawnchair.sdk.api"

    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        buildConfig false
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    api platform(libs.compose.bom)
    api libs.compose.ui
    api libs.kotlinx.coroutines.android
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def variantNameCap = variantName.capitalize()
        def typedefFile = layout.buildDirectory.file(
            "intermediates/annotations_typedef_file/${variantName}/extract${variantNameCap}Annotations/typedefs.txt",
        )
        def stubTask = tasks.register("prepare${variantNameCap}TypedefRecipe") {
            outputs.file(typedefFile)
            doLast {
                def outputFile = typedefFile.get().asFile
                outputFile.parentFile.mkdirs()
                outputFile.text = ""
            }
        }
        tasks.matching { it.name == "sync${variantNameCap}LibJars" }.configureEach {
            dependsOn(stubTask)
        }
    }
}

tasks.matching { it.name.startsWith("extract") && it.name.endsWith("Annotations") }.configureEach {
    enabled = false
}

tasks.matching { it.name.startsWith("sync") && it.name.endsWith("LibJars") }.configureEach {
    doFirst {
        def typedefRecipe = hasProperty("typedefRecipe") ? property("typedefRecipe") : null
        if (typedefRecipe instanceof File && !typedefRecipe.exists()) {
            typedefRecipe.parentFile.mkdirs()
            typedefRecipe.text = ""
        }
    }
}

def debugTypedefRecipe = file("$buildDir/intermediates/annotations_typedef_file/debug/extractDebugAnnotations/typedefs.txt")
debugTypedefRecipe.parentFile.mkdirs()
if (!debugTypedefRecipe.exists()) {
    debugTypedefRecipe.text = ""
}

afterEvaluate {
    publishing {
        publications {
            register("release", MavenPublication) {
                groupId = sdkPublishGroup.get()
                artifactId = "launcher-sdk-api"
                version = sdkPublishVersion.get()
                from components.release

                pom {
                    name = "Lawnchair SDK API"
                    description = "Public API surface for integrating with Lawnchair SDK features."
                    url = "https://github.com/vihuela/lawnchair-sdk"

                    licenses {
                        license {
                            name = "Apache License, Version 2.0"
                            url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }

                    scm {
                        url = "https://github.com/vihuela/lawnchair-sdk"
                        connection = "scm:git:https://github.com/vihuela/lawnchair-sdk.git"
                        developerConnection = "scm:git:ssh://git@github.com/vihuela/lawnchair-sdk.git"
                    }
                }
            }
        }
    }
}
