ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def variantNameCap = variantName.capitalize()
        def typedefFile = layout.buildDirectory.file(
            "intermediates/annotations_typedef_file/${variantName}/extract${variantNameCap}Annotations/typedefs.txt",
        )
        def stubTask = tasks.register("prepare${variantNameCap}TypedefRecipe") {
            outputs.file(typedefFile)
            doLast {
                def outputFile = typedefFile.get().asFile
                outputFile.parentFile.mkdirs()
                outputFile.text = ""
            }
        }
        tasks.matching { it.name == "sync${variantNameCap}LibJars" }.configureEach {
            dependsOn(stubTask)
        }
    }
}

tasks.matching { it.name.startsWith("extract") && it.name.endsWith("Annotations") }.configureEach {
    enabled = false
}

tasks.matching { it.name.startsWith("sync") && it.name.endsWith("LibJars") }.configureEach {
    doFirst {
        def typedefRecipe = hasProperty("typedefRecipe") ? property("typedefRecipe") : null
        if (typedefRecipe instanceof File && !typedefRecipe.exists()) {
            typedefRecipe.parentFile.mkdirs()
            typedefRecipe.text = ""
        }
    }
}

[
    "lawnWithQuickstepGithubDebug",
].each { variantName ->
    def variantNameCap = variantName.capitalize()
    def typedefRecipe = file("$buildDir/intermediates/annotations_typedef_file/${variantName}/extract${variantNameCap}Annotations/typedefs.txt")
    typedefRecipe.parentFile.mkdirs()
    if (!typedefRecipe.exists()) {
        typedefRecipe.text = ""
    }
}

afterEvaluate {
    publishing {
        publications {
            register("release", MavenPublication) {
                groupId = sdkPublishGroup.get()
                artifactId = "launcher-core"
                version = sdkPublishVersion.get()
                from components.lawnWithQuickstepGithubRelease

                pom {
                    name = "Lawnchair SDK Core"
                    description = "Embeddable Lawnchair launcher runtime with SDK extension hooks."
                    url = "https://github.com/vihuela/lawnchair-sdk"

                    licenses {
                        license {
                            name = "Apache License, Version 2.0"
                            url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }

                    scm {
                        url = "https://github.com/vihuela/lawnchair-sdk"
                        connection = "scm:git:https://github.com/vihuela/lawnchair-sdk.git"
                        developerConnection = "scm:git:ssh://git@github.com/vihuela/lawnchair-sdk.git"
                    }
                }
            }
        }
    }
}
