plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.google.ksp)
    alias(libs.plugins.google.protobuf)
    alias(libs.plugins.rikka.refine)
    id "maven-publish"
}

def launcherMinSdk = 26
def launcherTargetSdk = 35
def launcherApplicationId = "app.lawnchair"
def launcherVersionCode = 1
def launcherVersionName = "1"
def launcherCommitHash = providers.exec {
    workingDir projectDir
    commandLine('git', 'rev-parse', '--short=7', 'HEAD')
}.standardOutput.asText.get().trim()
def sdkPublishGroup = providers.environmentVariable("GROUP")
    .orElse(providers.gradleProperty("PUBLISH_GROUP"))
    .orElse("app.lawnchair")
def sdkPublishVersion = providers.environmentVariable("VERSION")
    .orElse(providers.gradleProperty("PUBLISH_VERSION"))
    .orElse("0.1.0-local")

android {
    namespace "com.android.launcher3"

    defaultConfig {
        minSdk launcherMinSdk
        targetSdk launcherTargetSdk
        buildConfigField "String", "APPLICATION_ID", "\"${launcherApplicationId}\""
        buildConfigField "int", "VERSION_CODE", "${launcherVersionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${launcherVersionName}\""
        buildConfigField "String", "COMMIT_HASH", "\"${launcherCommitHash}\""
        buildConfigField "int", "QUICKSTEP_MIN_SDK", "${launcherMinSdk}"
        buildConfigField "int", "QUICKSTEP_MAX_SDK", "${launcherTargetSdk}"
        resValue "string", "launcher_component", "app.lawnchair/app.lawnchair.LawnchairLauncher"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        aidl true
        buildConfig true
        resValues true
    }

    packagingOptions.resources.excludes += [
        "**/*.proto",
        "**/*.bin",
        "**/*.java",
        "**/*.properties",
        "**/*.version",
        "**/*.*_module",
        "com/**",
        "google/**",
        "kotlin/**",
        "kotlinx/**",
        "okhttp3/**",
        "META-INF/services/**",
        "META-INF/com/**",
        "META-INF/licenses/**",
        "META-INF/AL2.0",
        "META-INF/LGPL2.1",
    ]

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    flavorDimensions += ["app", "recents", "channel"]

    productFlavors {
        lawn {
            dimension "app"
        }

        withQuickstep {
            dimension "recents"
        }

        github {
            dimension "channel"
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['../res']
            java.srcDirs = ['../src', '../src_plugins']
            manifest.srcFile '../AndroidManifest-common.xml'
            proto {
                srcDirs = ['../protos', '../quickstep/protos_overrides']
            }
        }

        lawn {
            java.srcDirs = ['../src_flags', '../src_shortcuts_overrides', '../lawnchair/src', '../tests/shared']
            aidl.srcDirs = ['../lawnchair/aidl']
            res.srcDirs = ['../lawnchair/res', '../platform_frameworks_libs_systemui/animationlib/res']
            manifest.srcFile "../lawnchair/AndroidManifest.xml"
            assets.srcDirs = ['../lawnchair/assets']
            proto {
                srcDirs = ['../lawnchair/protos']
            }
        }

        github {
            manifest.srcFile "../github/AndroidManifest.xml"
        }

        lawnWithQuickstepGithub {
            manifest.srcFile "../quickstep/AndroidManifest-launcher.xml"
        }

        withQuickstep {
            res.srcDirs = ['../quickstep/res', '../quickstep/recents_ui_overrides/res']
            java.srcDirs = ['../quickstep/src', '../quickstep/recents_ui_overrides/src']
            manifest.srcFile "../quickstep/AndroidManifest.xml"
        }
    }

    publishing {
        singleVariant("lawnWithQuickstepGithubRelease") {
            withSourcesJar()
        }
    }
}

