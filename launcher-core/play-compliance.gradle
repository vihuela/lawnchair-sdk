import org.gradle.api.GradleException

// Play-sensitive capabilities must be physically absent from the distribution source tree.
// This is an enforcement list, not a source-set exclusion list: a newly restored forbidden file,
// manifest declaration, or dependency fails the build instead of being silently disabled.
def repositoryRoot = rootProject.projectDir.name == "sdk-local"
    ? rootProject.projectDir.parentFile
    : rootProject.projectDir

def forbiddenSourcePatterns = [
    "lawnchair/aidl/app/lawnchair/root/**",
    "lawnchair/res/layout/overview_actions_container.xml",
    "lawnchair/src/app/lawnchair/LawnchairAccessibilityService.kt",
    "lawnchair/src/app/lawnchair/bugreport/BugReportReceiver.kt",
    "lawnchair/src/app/lawnchair/bugreport/LawnchairBugReporter.kt",
    "lawnchair/src/app/lawnchair/bugreport/UploaderService.kt",
    "lawnchair/src/app/lawnchair/gestures/handlers/OpenNotificationsHandler.kt",
    "lawnchair/src/app/lawnchair/gestures/handlers/RecentsGestureHandler.kt",
    "lawnchair/src/app/lawnchair/gestures/handlers/SleepGestureHandler.kt",
    "lawnchair/src/app/lawnchair/overview/LawnchairOverviewActionsView.kt",
    "lawnchair/src/app/lawnchair/overview/TaskOverlayFactoryImpl.kt",
    "lawnchair/src/app/lawnchair/overview/TaskShortcutFactory.kt",
    "lawnchair/src/app/lawnchair/root/**",
    "lawnchair/src/app/lawnchair/ui/preferences/destinations/QuickstepPreferences.kt",
    "lawnchair/src/app/lawnchair/util/LawnchairLockedStateController.kt",
    "lawnchair/src/app/lawnchair/util/RecentHelper.kt",
    "lawnchair/src/app/lawnchair/util/TaskUtilLockState.kt",
    "quickstep/src/com/android/launcher3/uioverrides/touchcontrollers/StatusBarTouchController.java",
    "res/xml/accessibility_service_config.xml",
    "res/xml/sleep_policy.xml",
    "src/com/android/launcher3/model/SdCardAvailableReceiver.java",
]

