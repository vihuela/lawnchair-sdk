def forbiddenBuildEntries = [
    "build.gradle": [
        "libs.plugins.cash.licensee",
        "libs.libsu",
    ],
    "gradle/libs.versions.toml": [
        "app.cash.licensee",
        "com.github.topjohnwu.libsu",
        "libsu-core",
        "libsu-service",
    ],
]

def forbiddenSources = fileTree(repositoryRoot) {
    include forbiddenSourcePatterns
}
def inspectedFiles = (forbiddenManifestEntries.keySet() + forbiddenBuildEntries.keySet())
    .collect { new File(repositoryRoot, it) }

def verifyPlayCompliance = tasks.register("verifyPlayCompliance") {
    group = "verification"
    description = "Fails when a Play-sensitive source, manifest entry, or dependency is restored."
    inputs.files(forbiddenSources)
    inputs.files(inspectedFiles)

    doLast {
        def violations = []
        forbiddenSources.files.sort().each { file ->
            violations += "forbidden source exists: ${repositoryRoot.toPath().relativize(file.toPath())}"
        }

        forbiddenManifestEntries.each { relativePath, entries ->
            def manifest = new File(repositoryRoot, relativePath)
            if (!manifest.exists()) return
            def manifestText = manifest.getText("UTF-8")
            entries.each { entry ->
                if (manifestText.contains(entry)) {
                    violations += "forbidden manifest entry '${entry}' in ${relativePath}"
                }
            }
        }

        forbiddenBuildEntries.each { relativePath, entries ->
            def buildFile = new File(repositoryRoot, relativePath)
            if (!buildFile.exists()) return
            def buildText = buildFile.getText("UTF-8")
            entries.each { entry ->
                if (buildText.contains(entry)) {
                    violations += "forbidden build dependency '${entry}' in ${relativePath}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "Play compliance verification failed. Sensitive capabilities must be physically removed:\n" +
                    violations.collect { " - ${it}" }.join("\n"),
            )
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(verifyPlayCompliance)
}
