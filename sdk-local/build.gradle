import com.android.build.gradle.api.AndroidBasePlugin
import com.android.build.api.dsl.LibraryExtension
import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.tasks.GenerateModuleMetadata

plugins {
    id "maven-publish"
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.android.test) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.google.ksp) apply false
    alias(libs.plugins.google.protobuf) apply false
    alias(libs.plugins.rikka.refine) apply false
}

final def appCompileSdk = 36
final def appCompileSdkMinor = 1
final def appMinSdk = 26
final def appTargetSdk = 35
final def launcherPlatformVersion = providers.gradleProperty("launcherPlatformVersion").orElse("15").get()
final def sdkPublishGroup = providers.environmentVariable("GROUP")
    .orElse(providers.gradleProperty("PUBLISH_GROUP"))
    .orElse("app.lawnchair")
final def sdkPublishVersion = providers.environmentVariable("VERSION")
    .orElse(providers.gradleProperty("PUBLISH_VERSION"))
    .orElse("0.1-local")
final def githubPackagesOwner = providers.gradleProperty("githubPackagesOwner")
    .orElse(providers.environmentVariable("GITHUB_PACKAGES_OWNER"))
    .orElse("vihuela")
final def githubPackagesRepository = providers.gradleProperty("githubPackagesRepository")
    .orElse(providers.environmentVariable("GITHUB_PACKAGES_REPOSITORY"))
    .orElse("lawnchair-sdk")
final def githubPackagesUsername = providers.environmentVariable("GITHUB_PACKAGES_USERNAME")
    .orElse(providers.environmentVariable("GITHUB_ACTOR"))
final def githubPackagesToken = providers.environmentVariable("GITHUB_PACKAGES_TOKEN")
    .orElse(providers.environmentVariable("GITHUB_TOKEN"))

configurations {
    vendorRestrictionBypass {
        transitive = false
    }
    vendorPersianDate {
        transitive = false
    }
}

dependencies {
    vendorRestrictionBypass libs.chickenhook.restrictionbypass
    vendorPersianDate libs.persian.date
}

publishing {
    publications {
        register("restrictionBypass", MavenPublication) {
            groupId = sdkPublishGroup.get()
            artifactId = "restriction-bypass"
            version = sdkPublishVersion.get()
            artifact(providers.provider { configurations.vendorRestrictionBypass.singleFile }) {
                extension = "aar"
            }
        }
        register("persianDate", MavenPublication) {
            groupId = sdkPublishGroup.get()
            artifactId = "persian-date"
            version = sdkPublishVersion.get()
            artifact(providers.provider { configurations.vendorPersianDate.singleFile }) {
                extension = "aar"
            }
        }
    }
}

allprojects {
    group = sdkPublishGroup.get()
    version = sdkPublishVersion.get()

    plugins.withId("maven-publish") {
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }

        publishing {
            repositories {
                maven {
                    name = "GithubPackages"
                    url = uri("https://maven.pkg.github.com/${githubPackagesOwner.get()}/${githubPackagesRepository.get()}")
                    credentials {
                        username = githubPackagesUsername.getOrElse("")
                        password = githubPackagesToken.getOrElse("")
                    }
                }
            }
        }
    }

    plugins.withType(AndroidBasePlugin).configureEach {
        android {
            buildToolsVersion "36.1.0"
            compileSdk {
                version = release(appCompileSdk) {
                    minorApiLevel = appCompileSdkMinor
                }
            }
            defaultConfig {
                minSdk appMinSdk
                targetSdk appTargetSdk
                vectorDrawables.useSupportLibrary = true
            }
            lint {
                abortOnError true
                checkReleaseBuilds false
            }
            compileOptions {
                sourceCompatibility = libs.versions.jdkRelease.get()
                targetCompatibility = libs.versions.jdkRelease.get()
            }
        }
        dependencies {
            implementation libs.androidx.core.ktx
        }
    }

    plugins.withId("com.google.protobuf") {
        protobuf {
            protoc {
                artifact = libs.protobuf.protoc.get().toString()
            }
            generateProtoTasks {
                all().configureEach { task ->
                    task.builtins {
                        remove java
                        java {
                            option "lite"
                        }
                    }
                }
            }
        }
        dependencies {
            implementation libs.protobuf.javalite
        }
    }

    plugins.withType(JavaBasePlugin).configureEach {
        java {
            sourceCompatibility = libs.versions.jdkRelease.get()
            targetCompatibility = libs.versions.jdkRelease.get()
        }
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmDefault = JvmDefaultMode.ENABLE
            jvmTarget = JvmTarget.fromTarget(libs.versions.jdkRelease.get())
        }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency {
            if (requested.module == libs.kotlin.androidExtensionRuntime.get().module) {
                useTarget(libs.kotlin.parcelizeRuntime)
            }
        }
    }

    ext {
        FRAMEWORK_PREBUILTS_DIR = "$rootDir/prebuilts/libs"
        LAUNCHER_PLATFORM_VERSION = launcherPlatformVersion
        FRAMEWORK_JAR = "framework-${launcherPlatformVersion}.jar"
        SYSTEM_UI_STATSD_JAR = "SystemUI-statsd-${launcherPlatformVersion}.jar"
        WINDOW_MANAGER_SHELL_JAR = "WindowManager-Shell-${launcherPlatformVersion}.jar"

        addFrameworkJar = { String name ->
            def selectedName = name == "framework-15.jar" ? FRAMEWORK_JAR : name
            def frameworkJar = new File(FRAMEWORK_PREBUILTS_DIR, selectedName)
            if (!frameworkJar.exists()) {
                throw new IllegalArgumentException("Framework jar path ${frameworkJar.path} doesn't exist")
            }
            gradle.projectsEvaluated {
                tasks.withType(JavaCompile).configureEach {
                    classpath = files(frameworkJar, classpath)
                }
                tasks.withType(KotlinCompile).configureEach {
                    libraries.setFrom files(frameworkJar, libraries)
                }
            }
            dependencies {
                compileOnly files(frameworkJar)
            }
        }

        compileOnlyCommonJars = {
            dependencies {
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: "SystemUI-core.jar")
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: "SystemUI-statsd.jar")
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: WINDOW_MANAGER_SHELL_JAR)

                compileOnly projects.compatLib
                compileOnly projects.compatLib.compatLibVQ
                compileOnly projects.compatLib.compatLibVR
                compileOnly projects.compatLib.compatLibVS
                compileOnly projects.compatLib.compatLibVT
                compileOnly projects.compatLib.compatLibVU
                compileOnly projects.compatLib.compatLibVV
            }
        }
    }
}

subprojects { subproject ->
    plugins.withId("com.android.library") {
        if (subproject.name in ["launcher-core", "launcher-sdk-api", "launcher-sdk-runtime"]) {
            return
        }

        subproject.pluginManager.apply("maven-publish")
        subproject.extensions.configure(LibraryExtension) { libraryExtension ->
            libraryExtension.publishing {
                singleVariant("release") {
                }
            }
        }
        subproject.afterEvaluate {
            publishing {
                publications {
                    if (findByName("release") == null) {
                        register("release", MavenPublication) {
                            groupId = sdkPublishGroup.get()
                            artifactId = subproject.name
                            version = sdkPublishVersion.get()
                            from components.release
                        }
                    }
                }
            }
        }
    }
}
